<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>イベント出欠確認</title>
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Google Fonts: Roboto & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --md-sys-color-primary: #006C4C;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #89F8C7;
      --md-sys-color-on-primary-container: #002114;

      --md-sys-color-secondary: #4D6357;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #CFE9D9;
      --md-sys-color-on-secondary-container: #092016;

      --md-sys-color-surface: #F6FBF6;
      --md-sys-color-on-surface: #181D1A;
      --md-sys-color-surface-variant: #DBE5DE;
      --md-sys-color-on-surface-variant: #404944;

      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F0F5F0;
      --md-sys-color-surface-container: #EAEFEA;
      --md-sys-color-surface-container-high: #E4E9E5;
      --md-sys-color-surface-container-highest: #DFE4DF;

      --md-sys-color-outline: #707973;
      --md-sys-color-outline-variant: #BFC9C2;
      --md-sys-color-error: #BA1A1A;
      --md-sys-color-error-container: #FFDAD6;
      --md-sys-color-on-error-container: #410002;

      /* M3 Warning / Neutral Roles */
      --md-sys-color-tertiary-container: #FFDCC1;
      --md-sys-color-on-tertiary-container: #2E1500;

      --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);
      --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);

      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', 'Noto Sans JP', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-app-bar {
      background-color: var(--md-sys-color-surface-container-low);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-surface-container-highest);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-app-bar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }

    .top-app-bar .brand .material-symbols-outlined {
      color: var(--md-sys-color-primary);
      font-size: 24px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-surface-container);
      padding: 4px 10px 4px 6px;
      border-radius: var(--md-shape-corner-full);
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 140px;
    }

    .user-chip img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-chip span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .main-container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
      padding: 20px;
      box-shadow: var(--md-elevation-1);
    }

    .field-wrapper { margin-bottom: 14px; }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .select-container { position: relative; }

    .m3-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 12px 36px 12px 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      outline: none;
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--md-sys-color-on-surface-variant);
    }

    .event-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
    }

    .event-meta-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .meta-row .material-symbols-outlined {
      font-size: 18px;
      color: var(--md-sys-color-primary);
    }

    .deadline-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: var(--md-shape-corner-small);
      font-size: 13px;
      font-weight: 700;
      margin-top: 10px;
    }

    .deadline-open {
      background-color: var(--md-sys-color-surface-container);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .deadline-closed {
      background-color: var(--md-sys-color-error-container);
      color: var(--md-sys-color-on-error-container);
    }

    .locked-banner {
      background-color: var(--md-sys-color-surface-container);
      border-radius: var(--md-shape-corner-medium);
      padding: 12px 16px;
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--md-sys-color-outline);
    }

    .m3-text-field {
      width: 100%;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 10px 14px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      outline: none;
    }

    .m3-text-field:focus {
      border-color: var(--md-sys-color-primary);
      border-width: 2px;
      padding: 9px 13px;
      background-color: var(--md-sys-color-surface-container-lowest);
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--md-sys-color-surface-container-highest);
    }

    .m3-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      border-radius: var(--md-shape-corner-full);
      font-size: 14px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .m3-btn:active { transform: scale(0.98); }

    .m3-btn-attend {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: var(--md-elevation-1);
    }

    .m3-btn-absent {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .m3-btn.is-active {
      outline: 3px solid var(--md-sys-color-primary-container);
    }

    .cancel-wrapper {
      text-align: center;
      margin-top: 8px;
    }

    .m3-btn-text-danger {
      background: none;
      border: none;
      color: var(--md-sys-color-outline);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: var(--md-shape-corner-full);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .copy-banner {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--md-sys-color-surface-container-highest);
    }

    .m3-btn-tonal {
      width: 100%;
      height: 44px;
      background-color: var(--md-sys-color-secondary-container);
      color: var(--md-sys-color-on-secondary-container);
      border: none;
      border-radius: var(--md-shape-corner-full);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-headline {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-attend {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--md-shape-corner-full);
    }

    .chip-absent {
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-outline);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--md-shape-corner-full);
    }

    .section-divider {
      height: 1px;
      background-color: var(--md-sys-color-surface-container-highest);
      margin: 18px 0;
    }

    .attendee-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .attendee-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--md-sys-color-surface-container);
    }

    .attendee-item:last-child { border-bottom: none; }

    .avatar-wrapper {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-outline);
      margin-top: 2px;
    }

    .avatar-img { width: 100%; height: 100%; object-fit: cover; }

    .attendee-content { flex: 1; min-width: 0; }

    .attendee-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .attendee-comment {
      font-size: 12px;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 3px;
      line-height: 1.45;
      white-space: normal;
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .empty-text {
      font-size: 13px;
      color: var(--md-sys-color-outline);
      padding: 8px 0;
      text-align: center;
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--md-sys-color-outline);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
      padding: 24px;
      text-align: center;
    }

    .m3-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--md-sys-color-surface-container-highest);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <header class="top-app-bar">
    <div class="brand">
      <span class="material-symbols-outlined">event_available</span>
      <span>出欠チェック</span>
    </div>
    <div class="user-chip" id="userChip" style="display: none;">
      <img id="userAvatar" src="" alt="user">
      <span id="userName">--</span>
    </div>
  </header>

  <div id="loadingScreen" class="loading-screen">
    <div class="m3-spinner" id="spinner"></div>
    <p id="loadingText">LINE認証およびデータを読み込み中...</p>
    <div id="errorDetail" style="display: none; width: 100%; max-width: 360px; margin-top: 16px;"></div>
  </div>

  <main id="mainApp" class="main-container" style="display: none;">

    <section class="m3-card">
      <div class="field-wrapper">
        <label class="field-label" for="eventSelect">
          <span class="material-symbols-outlined" style="font-size: 14px;">calendar_month</span>
          イベントを選択
        </label>
        <div class="select-container">
          <select id="eventSelect" class="m3-select" onchange="onSelectEvent()"></select>
          <span class="material-symbols-outlined select-arrow">arrow_drop_down</span>
        </div>
      </div>

      <div class="event-header">
        <h1 class="event-title" id="eventTitle">--</h1>
        <div class="event-meta-list">
          <div class="meta-row">
            <span class="material-symbols-outlined">schedule</span>
            <span id="eventDateTime">--</span>
          </div>
          <div class="meta-row">
            <span class="material-symbols-outlined">location_on</span>
            <span id="eventDesc">--</span>
          </div>
        </div>

        <!-- 入力期限表示バッジ -->
        <div id="deadlineContainer">
          <div class="deadline-badge" id="deadlineBadge">
            <span class="material-symbols-outlined" id="deadlineIcon" style="font-size: 16px;">timer</span>
            <span id="deadlineText">--</span>
          </div>
        </div>
      </div>

      <!-- 入力受付中エリア -->
      <div id="interactiveArea">
        <div class="field-wrapper" style="margin-top: 14px; margin-bottom: 4px;">
          <label class="field-label" for="userComment">
            <span class="material-symbols-outlined" style="font-size: 14px;">chat_bubble_outline</span>
            ひとこと備考（任意）
          </label>
          <input type="text" id="userComment" class="m3-text-field" placeholder="例: 30分遅れて参加、同伴1名など" maxlength="100">
        </div>

        <div class="action-group">
          <button type="button" class="m3-btn m3-btn-attend" id="btnAttend" onclick="submitStatus('参加')">
            <span class="material-symbols-outlined">check_circle</span>
            <span>参加する</span>
          </button>
          <button type="button" class="m3-btn m3-btn-absent" id="btnAbsent" onclick="submitStatus('不参加')">
            <span class="material-symbols-outlined">cancel</span>
            <span>不参加</span>
          </button>
        </div>

        <div class="cancel-wrapper" id="cancelWrapper" style="display: none;">
          <button type="button" class="m3-btn-text-danger" onclick="cancelStatus()">
            <span class="material-symbols-outlined" style="font-size: 16px;">restart_alt</span>
            <span>回答を取り消す（未定に戻す）</span>
          </button>
        </div>
      </div>

      <!-- 締切超過／過去ログ閲覧バナー -->
      <div id="lockedBanner" class="locked-banner" style="display: none;">
        <span class="material-symbols-outlined" style="color: var(--md-sys-color-error);">lock</span>
        <span id="lockedText">入力期限を過ぎたため、回答・変更は締め切られました（閲覧専用）</span>
      </div>
    </section>

    <!-- 回答状況カード -->
    <section class="m3-card">
      <div class="section-title-wrap">
        <h2 class="section-headline" style="color: var(--md-sys-color-primary);">
          <span class="material-symbols-outlined">check_circle</span>
          <span>参加者</span>
        </h2>
        <span class="chip-attend" id="attendCountChip">0名</span>
      </div>
      <ul class="attendee-list" id="attendList"></ul>

      <div class="section-divider"></div>

      <div class="section-title-wrap">
        <h2 class="section-headline" style="color: var(--md-sys-color-outline);">
          <span class="material-symbols-outlined">cancel</span>
          <span>不参加</span>
        </h2>
        <span class="chip-absent" id="absentCountChip">0名</span>
      </div>
      <ul class="attendee-list" id="absentList"></ul>

      <div class="copy-banner">
        <button type="button" class="m3-btn-tonal" id="btnCopyShare" onclick="copyShareText()">
          <span class="material-symbols-outlined" id="copyIcon">content_copy</span>
          <span id="copyBtnText">LINE共有用に状況をコピー</span>
        </button>
      </div>
    </section>

  </main>

  <script>
    const LIFF_ID = "2012168227-DjHQL1TU";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycby-0JqjobCyEInDrMmjdAMc4eWByg-u3N1pIXCrGm2itxtG-Pdv3drG7LPo8-X8K0PxeQ/exec";

    let currentUser = { uid: '', name: '', iconUrl: '' };
    let currentEventId = '';
    let latestDetailData = null;

    function showFatalError(title, detailText) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('loadingText').style.display = 'none';

      const errorBox = document.getElementById('errorDetail');
      errorBox.style.display = 'block';
      errorBox.innerHTML = `
        <div style="background-color: var(--md-sys-color-error-container); color: var(--md-sys-color-on-error-container); border-radius: 12px; padding: 16px; text-align: left;">
          <div style="display:flex; align-items:center; gap:8px; font-weight:bold; font-size:15px;">
            <span class="material-symbols-outlined">error</span>
            <span>${title}</span>
          </div>
          <div style="line-height:1.6; margin-top:6px; font-size:13px;">${detailText}</div>
        </div>
      `;
    }

    window.onload = async function() {
      if (!LIFF_ID || LIFF_ID.includes('YOUR_LIFF_ID')) {
        showFatalError('設定エラー', 'HTMLコード内の <code>const LIFF_ID</code> を実際の発行値に書き換えてください。');
        return;
      }
      if (!GAS_API_URL || GAS_API_URL.includes('YOUR_GAS_WEBAPP_URL')) {
        showFatalError('設定エラー', 'HTMLコード内の <code>const GAS_API_URL</code> をデプロイしたURLに書き換えてください。');
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      currentEventId = urlParams.get('eventId') || '';

      try {
        await liff.init({ liffId: LIFF_ID.trim() });
      } catch (err) {
        showFatalError('LIFF初期化エラー', err.message);
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      try {
        const profile = await liff.getProfile();
        currentUser.uid = profile.userId;
        currentUser.name = profile.displayName;
        currentUser.iconUrl = profile.pictureUrl || '';
      } catch (pErr) {
        currentUser.uid = 'guest_' + Math.random().toString(36).substring(2, 9);
        currentUser.name = 'LINEゲスト';
      }

      document.getElementById('userName').textContent = currentUser.name;
      if (currentUser.iconUrl) {
        document.getElementById('userAvatar').src = currentUser.iconUrl;
      } else {
        document.getElementById('userAvatar').src = 'https://via.placeholder.com/20?text=U';
      }
      document.getElementById('userChip').style.display = 'flex';

      await loadEvents();
    };

    async function loadEvents() {
      try {
        const res = await fetch(`${GAS_API_URL.trim()}?action=getEvents`);
        const json = await res.json();

        if (!json.success) {
          showFatalError('GAS APIエラー', json.error || '不明なエラー');
          return;
        }

        const activeList = json.events.active || [];
        const pastList = json.events.past || [];

        if (activeList.length === 0 && pastList.length === 0) {
          document.getElementById('loadingScreen').innerHTML = `
            <div class="empty-state">
              <span class="material-symbols-outlined">event_busy</span>
              <p>現在受付中および過去30日の予定はありません。<br>（Googleカレンダーに「#出欠」を含む予定を作成してください）</p>
            </div>`;
          return;
        }

        const select = document.getElementById('eventSelect');
        select.innerHTML = '';

        if (activeList.length > 0) {
          const optGroupActive = document.createElement('optgroup');
          optGroupActive.label = "【受付中】";
          activeList.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            opt.textContent = `${ev.date} - ${ev.title}`;
            optGroupActive.appendChild(opt);
          });
          select.appendChild(optGroupActive);
        }

        if (pastList.length > 0) {
          const optGroupPast = document.createElement('optgroup');
          optGroupPast.label = "【終了・過去ログ】";
          pastList.forEach(ev => {
            const opt = document.createElement('option');
            opt.value = ev.id;
            const tag = ev.isFinished ? "終了" : "締切済";
            opt.textContent = `${ev.date} - ${ev.title} (${tag})`;
            optGroupPast.appendChild(opt);
          });
          select.appendChild(optGroupPast);
        }

        const allEvents = [...activeList, ...pastList];
        if (currentEventId && allEvents.some(e => e.id === currentEventId)) {
          select.value = currentEventId;
        } else {
          select.value = allEvents[0].id;
          currentEventId = allEvents[0].id;
        }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';

        await fetchEventDetail(select.value);
      } catch (err) {
        showFatalError('通信エラー', err.message);
      }
    }

    function onSelectEvent() {
      const selectedId = document.getElementById('eventSelect').value;
      currentEventId = selectedId;
      fetchEventDetail(selectedId);
    }

    async function fetchEventDetail(eventId) {
      try {
        const res = await fetch(`${GAS_API_URL.trim()}?action=getDetail&eventId=${encodeURIComponent(eventId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          renderDetail(json.data);
        }
      } catch (err) {
        console.error('詳細取得エラー:', err);
      }
    }

    function renderDetail(data) {
      if (!data || !data.event) return;
      latestDetailData = data;

      const ev = data.event;
      document.getElementById('eventTitle').textContent = ev.title;
      document.getElementById('eventDateTime').textContent = `${ev.date} ${ev.time}`;
      document.getElementById('eventDesc').textContent = ev.description || '特記事項なし';

      const deadlineBadge = document.getElementById('deadlineBadge');
      const deadlineIcon = document.getElementById('deadlineIcon');
      const deadlineText = document.getElementById('deadlineText');
      const interactiveArea = document.getElementById('interactiveArea');
      const lockedBanner = document.getElementById('lockedBanner');
      const lockedText = document.getElementById('lockedText');

      if (ev.isFinished) {
        deadlineBadge.className = 'deadline-badge deadline-closed';
        deadlineIcon.textContent = 'event_busy';
        deadlineText.textContent = `イベント終了（最終結果）`;

        interactiveArea.style.display = 'none';
        lockedBanner.style.display = 'flex';
        lockedText.textContent = 'このイベントは終了しました（最終ログ閲覧モード）';
      } else if (ev.isClosed) {
        deadlineBadge.className = 'deadline-badge deadline-closed';
        deadlineIcon.textContent = 'lock_clock';
        deadlineText.textContent = `受付終了（締切：${ev.deadlineStr}）`;

        interactiveArea.style.display = 'none';
        lockedBanner.style.display = 'flex';
        lockedText.textContent = '入力期限を過ぎたため、回答・変更は締め切られました（確定）';
      } else {
        deadlineBadge.className = 'deadline-badge deadline-open';
        deadlineIcon.textContent = 'timer';
        deadlineText.textContent = `入力期限：${ev.deadlineStr} まで`;

        interactiveArea.style.display = 'block';
        lockedBanner.style.display = 'none';
      }

      const attendees = data.attendees || [];
      const attendList = attendees.filter(a => a.status === '参加');
      const absentList = attendees.filter(a => a.status === '不参加');

      document.getElementById('attendCountChip').textContent = `${attendList.length}名`;
      document.getElementById('absentCountChip').textContent = `${absentList.length}名`;

      const myRecord = attendees.find(a => a.uid === currentUser.uid);
      const btnAttend = document.getElementById('btnAttend');
      const btnAbsent = document.getElementById('btnAbsent');
      const cancelWrapper = document.getElementById('cancelWrapper');
      const commentInput = document.getElementById('userComment');

      btnAttend.classList.remove('is-active');
      btnAbsent.classList.remove('is-active');

      if (myRecord) {
        if (myRecord.status === '参加') btnAttend.classList.add('is-active');
        if (myRecord.status === '不参加') btnAbsent.classList.add('is-active');
        commentInput.value = myRecord.comment || '';
        cancelWrapper.style.display = (!ev.isClosed && !ev.isFinished) ? 'block' : 'none';
      } else {
        cancelWrapper.style.display = 'none';
        commentInput.value = '';
      }

      const attendEl = document.getElementById('attendList');
      attendEl.innerHTML = '';
      if (attendList.length === 0) {
        attendEl.innerHTML = '<li class="empty-text">参加予定の人はいません</li>';
      } else {
        attendList.forEach(a => attendEl.appendChild(createAttendeeItem(a)));
      }

      const absentEl = document.getElementById('absentList');
      absentEl.innerHTML = '';
      if (absentList.length === 0) {
        absentEl.innerHTML = '<li class="empty-text">不参加の回答はありません</li>';
      } else {
        absentList.forEach(a => absentEl.appendChild(createAttendeeItem(a)));
      }
    }

    function createAttendeeItem(person) {
      const li = document.createElement('li');
      li.className = 'attendee-item';

      const avatarWrapper = document.createElement('div');
      avatarWrapper.className = 'avatar-wrapper';

      if (person.iconUrl) {
        const img = document.createElement('img');
        img.className = 'avatar-img';
        img.src = person.iconUrl;
        avatarWrapper.appendChild(img);
      } else {
        avatarWrapper.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px;">person</span>';
      }

      const content = document.createElement('div');
      content.className = 'attendee-content';

      const name = document.createElement('div');
      name.className = 'attendee-name';
      name.textContent = person.name + (person.uid === currentUser.uid ? ' (あなた)' : '');
      content.appendChild(name);

      if (person.comment && person.comment.trim() !== '') {
        const comment = document.createElement('div');
        comment.className = 'attendee-comment';
        comment.textContent = `💬 ${person.comment}`;
        content.appendChild(comment);
      }

      li.appendChild(avatarWrapper);
      li.appendChild(content);
      return li;
    }

    async function submitStatus(status) {
      const eventId = document.getElementById('eventSelect').value;
      if (!eventId) return;

      const comment = document.getElementById('userComment').value.trim();

      if (status === '参加') {
        document.getElementById('attendCountChip').textContent = '記録中...';
      } else {
        document.getElementById('absentCountChip').textContent = '記録中...';
      }

      try {
        const payload = {
          action: 'record',
          eventId: eventId,
          uid: currentUser.uid,
          name: currentUser.name,
          status: status,
          iconUrl: currentUser.iconUrl,
          comment: comment
        };

        const res = await fetch(GAS_API_URL.trim(), {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.success && json.data) {
          renderDetail(json.data);
        } else {
          alert('登録エラー: ' + (json.error || '不明なエラー'));
        }
      } catch (err) {
        alert('通信エラーが発生しました: ' + err.message);
      }
    }

    async function cancelStatus() {
      const eventId = document.getElementById('eventSelect').value;
      if (!eventId) return;

      if (!confirm('回答を取り消して未定に戻しますか？')) {
        return;
      }

      document.getElementById('attendCountChip').textContent = '更新中...';
      document.getElementById('absentCountChip').textContent = '更新中...';

      try {
        const payload = {
          action: 'cancel',
          eventId: eventId,
          uid: currentUser.uid
        };

        const res = await fetch(GAS_API_URL.trim(), {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.success && json.data) {
          renderDetail(json.data);
        } else {
          alert('取り消しエラー: ' + (json.error || '不明なエラー'));
        }
      } catch (err) {
        alert('通信エラーが発生しました: ' + err.message);
      }
    }

    // 【改修】人数のみを出力する共有テキスト生成
    function copyShareText() {
      if (!latestDetailData || !latestDetailData.event) return;

      const ev = latestDetailData.event;
      const attendees = latestDetailData.attendees || [];
      const attendList = attendees.filter(a => a.status === '参加');
      const absentList = attendees.filter(a => a.status === '不参加');

      const isLog = ev.isFinished || ev.isClosed;
      let text = `【${ev.title}${isLog ? '（確定・結果）' : ''}】\n`;
      text += `📅 日時：${ev.date} ${ev.time}\n`;
      if (ev.description && ev.description !== '詳細情報なし') {
        text += `📍 場所：${ev.description}\n`;
      }
      if (!ev.isFinished) {
        text += `⏳ 締切：${ev.deadlineStr}\n`;
      }
      text += `\n`;

      // アカウント一覧のループを排除し、人数のみを出力
      text += `◯ 参加：${attendList.length}名\n`;
      text += `✕ 不参加：${absentList.length}名\n\n`;

      text += `▼ 出欠の回答・確認はこちら\n`;
      text += `https://liff.line.me/${LIFF_ID.trim()}?eventId=${encodeURIComponent(ev.id)}`;

      navigator.clipboard.writeText(text).then(() => {
        const btn = document.getElementById('btnCopyShare');
        const icon = document.getElementById('copyIcon');
        const label = document.getElementById('copyBtnText');

        icon.textContent = 'check';
        label.textContent = 'コピーしました！';
        btn.style.backgroundColor = 'var(--md-sys-color-primary-container)';
        btn.style.color = 'var(--md-sys-color-on-primary-container)';

        setTimeout(() => {
          icon.textContent = 'content_copy';
          label.textContent = 'LINE共有用に状況をコピー';
          btn.style.backgroundColor = '';
          btn.style.color = '';
        }, 2000);
      }).catch(err => {
        alert('コピーに失敗しました: ' + err);
      });
    }
  </script>
</body>
</html>
