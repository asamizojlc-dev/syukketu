<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>イベント出欠確認</title>
  
  <!-- LINE LIFF SDK -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Google Fonts: Roboto & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    :root {
      --md-sys-color-primary: #006C4C;
      --md-sys-color-on-primary: #FFFFFF;
      --md-sys-color-primary-container: #89F8C7;
      --md-sys-color-on-primary-container: #002114;

      --md-sys-color-secondary: #4D6357;
      --md-sys-color-on-secondary: #FFFFFF;
      --md-sys-color-secondary-container: #CFE9D9;
      --md-sys-color-on-secondary-container: #092016;

      --md-sys-color-surface: #F6FBF6;
      --md-sys-color-on-surface: #181D1A;
      --md-sys-color-surface-variant: #DBE5DE;
      --md-sys-color-on-surface-variant: #404944;

      --md-sys-color-surface-container-lowest: #FFFFFF;
      --md-sys-color-surface-container-low: #F0F5F0;
      --md-sys-color-surface-container: #EAEFEA;
      --md-sys-color-surface-container-high: #E4E9E5;
      --md-sys-color-surface-container-highest: #DFE4DF;

      --md-sys-color-outline: #707973;
      --md-sys-color-outline-variant: #BFC9C2;

      --md-elevation-1: 0px 1px 3px 1px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);
      --md-elevation-2: 0px 2px 6px 2px rgba(0, 0, 0, 0.15), 0px 1px 2px 0px rgba(0, 0, 0, 0.30);

      --md-shape-corner-small: 8px;
      --md-shape-corner-medium: 12px;
      --md-shape-corner-large: 16px;
      --md-shape-corner-full: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Roboto', 'Noto Sans JP', sans-serif;
      background-color: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-app-bar {
      background-color: var(--md-sys-color-surface-container-low);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--md-sys-color-surface-container-highest);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .top-app-bar .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--md-sys-color-on-surface);
    }

    .top-app-bar .brand .material-symbols-outlined {
      color: var(--md-sys-color-primary);
      font-size: 24px;
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--md-sys-color-surface-container);
      padding: 4px 10px 4px 6px;
      border-radius: var(--md-shape-corner-full);
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      max-width: 140px;
    }

    .user-chip img {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-chip span {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .main-container {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .m3-card {
      background-color: var(--md-sys-color-surface-container-lowest);
      border-radius: var(--md-shape-corner-large);
      padding: 20px;
      box-shadow: var(--md-elevation-1);
    }

    .field-wrapper { margin-bottom: 16px; }

    .field-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .select-container { position: relative; }

    .m3-select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      background-color: var(--md-sys-color-surface-container-low);
      border: 1px solid var(--md-sys-color-outline-variant);
      border-radius: var(--md-shape-corner-small);
      padding: 12px 36px 12px 14px;
      font-size: 15px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      font-family: inherit;
      outline: none;
    }

    .select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: var(--md-sys-color-on-surface-variant);
    }

    .event-title {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--md-sys-color-on-surface);
      margin-bottom: 8px;
    }

    .event-meta-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--md-sys-color-on-surface-variant);
    }

    .meta-row .material-symbols-outlined {
      font-size: 18px;
      color: var(--md-sys-color-primary);
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--md-sys-color-surface-container-highest);
    }

    .m3-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      height: 48px;
      border-radius: var(--md-shape-corner-full);
      font-size: 14px;
      font-weight: 700;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background-color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .m3-btn:active { transform: scale(0.98); }

    .m3-btn-attend {
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      box-shadow: var(--md-elevation-1);
    }

    .m3-btn-absent {
      background-color: var(--md-sys-color-surface-container-high);
      color: var(--md-sys-color-on-surface-variant);
      border: 1px solid var(--md-sys-color-outline-variant);
    }

    .m3-btn.is-active {
      outline: 3px solid var(--md-sys-color-primary-container);
    }

    /* 【改修】セクションヘッダー＆バッジ */
    .section-title-wrap {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-headline {
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chip-attend {
      background-color: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--md-shape-corner-full);
    }

    .chip-absent {
      background-color: var(--md-sys-color-surface-container-highest);
      color: var(--md-sys-color-outline);
      font-size: 12px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: var(--md-shape-corner-full);
    }

    .section-divider {
      height: 1px;
      background-color: var(--md-sys-color-surface-container-highest);
      margin: 18px 0;
    }

    .attendee-list {
      list-style: none;
      display: flex;
      flex-direction: column;
    }

    .attendee-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--md-sys-color-surface-container);
    }

    .attendee-item:last-child { border-bottom: none; }

    .avatar-wrapper {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--md-sys-color-surface-container-highest);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--md-sys-color-outline);
    }

    .avatar-img { width: 100%; height: 100%; object-fit: cover; }

    .attendee-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--md-sys-color-on-surface);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .empty-text {
      font-size: 13px;
      color: var(--md-sys-color-outline);
      padding: 8px 0;
      text-align: center;
    }

    .empty-state {
      padding: 32px 16px;
      text-align: center;
      color: var(--md-sys-color-outline);
      font-size: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .loading-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--md-sys-color-on-surface-variant);
      font-size: 14px;
    }

    .m3-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid var(--md-sys-color-surface-container-highest);
      border-top-color: var(--md-sys-color-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <header class="top-app-bar">
    <div class="brand">
      <span class="material-symbols-outlined">event_available</span>
      <span>出欠チェック</span>
    </div>
    <div class="user-chip" id="userChip" style="display: none;">
      <img id="userAvatar" src="" alt="user">
      <span id="userName">--</span>
    </div>
  </header>

  <!-- Loading State -->
  <div id="loadingScreen" class="loading-screen">
    <div class="m3-spinner"></div>
    <p>LINE認証およびデータを読み込み中...</p>
  </div>

  <!-- Main View -->
  <main id="mainApp" class="main-container" style="display: none;">

    <section class="m3-card">
      <div class="field-wrapper">
        <label class="field-label" for="eventSelect">
          <span class="material-symbols-outlined" style="font-size: 14px;">calendar_month</span>
          イベントを選択（直近順）
        </label>
        <div class="select-container">
          <select id="eventSelect" class="m3-select" onchange="onSelectEvent()"></select>
          <span class="material-symbols-outlined select-arrow">arrow_drop_down</span>
        </div>
      </div>

      <div class="event-header">
        <h1 class="event-title" id="eventTitle">--</h1>
        <div class="event-meta-list">
          <div class="meta-row">
            <span class="material-symbols-outlined">schedule</span>
            <span id="eventDateTime">--</span>
          </div>
          <div class="meta-row">
            <span class="material-symbols-outlined">location_on</span>
            <span id="eventDesc">--</span>
          </div>
        </div>
      </div>

      <div class="action-group">
        <button type="button" class="m3-btn m3-btn-attend" id="btnAttend" onclick="submitStatus('参加')">
          <span class="material-symbols-outlined">check_circle</span>
          <span>参加する</span>
        </button>
        <button type="button" class="m3-btn m3-btn-absent" id="btnAbsent" onclick="submitStatus('不参加')">
          <span class="material-symbols-outlined">cancel</span>
          <span>不参加</span>
        </button>
      </div>
    </section>

    <!-- 【改修】参加者・不参加者 分離カード -->
    <section class="m3-card">
      <!-- 参加者エリア -->
      <div class="section-title-wrap">
        <h2 class="section-headline" style="color: var(--md-sys-color-primary);">
          <span class="material-symbols-outlined">check_circle</span>
          <span>参加者</span>
        </h2>
        <span class="chip-attend" id="attendCountChip">0名</span>
      </div>
      <ul class="attendee-list" id="attendList"></ul>

      <div class="section-divider"></div>

      <!-- 不参加者エリア -->
      <div class="section-title-wrap">
        <h2 class="section-headline" style="color: var(--md-sys-color-outline);">
          <span class="material-symbols-outlined">cancel</span>
          <span>不参加</span>
        </h2>
        <span class="chip-absent" id="absentCountChip">0名</span>
      </div>
      <ul class="attendee-list" id="absentList"></ul>
    </section>

  </main>

  <script>
    // ★ 1. LINE Developersで発行したLIFF ID
    const LIFF_ID = "YOUR_LIFF_ID";

    // ★ 2. GASのウェブアプリURL（/exec で終わるURL）
    const GAS_API_URL = "YOUR_GAS_WEBAPP_URL";

    let currentUser = { uid: '', name: '', iconUrl: '' };
    let currentEventId = '';

    window.onload = async function() {
      const urlParams = new URLSearchParams(window.location.search);
      currentEventId = urlParams.get('eventId') || '';

      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();
        currentUser.uid = profile.userId;
        currentUser.name = profile.displayName;
        currentUser.iconUrl = profile.pictureUrl || '';

        document.getElementById('userName').textContent = currentUser.name;
        if (currentUser.iconUrl) {
          document.getElementById('userAvatar').src = currentUser.iconUrl;
        } else {
          document.getElementById('userAvatar').src = 'https://via.placeholder.com/20?text=U';
        }
        document.getElementById('userChip').style.display = 'flex';

        await loadEvents();
      } catch (err) {
        alert('初期化エラー: ' + err.message);
      }
    };

    async function loadEvents() {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getEvents`);
        const json = await res.json();

        if (!json.success || !json.events || json.events.length === 0) {
          document.getElementById('loadingScreen').innerHTML = `
            <div class="empty-state">
              <span class="material-symbols-outlined">event_busy</span>
              <p>現在受付中の予定はありません。<br>（終了したイベントは自動非表示になります）</p>
            </div>`;
          return;
        }

        const select = document.getElementById('eventSelect');
        select.innerHTML = '';
        json.events.forEach(ev => {
          const opt = document.createElement('option');
          opt.value = ev.id;
          opt.textContent = `${ev.date} - ${ev.title}`;
          select.appendChild(opt);
        });

        if (currentEventId && json.events.some(e => e.id === currentEventId)) {
          select.value = currentEventId;
        } else {
          currentEventId = json.events[0].id;
        }

        document.getElementById('loadingScreen').style.display = 'none';
        document.getElementById('mainApp').style.display = 'flex';

        await fetchEventDetail(select.value);
      } catch (err) {
        alert('イベント一覧の取得に失敗しました: ' + err.message);
      }
    }

    function onSelectEvent() {
      const selectedId = document.getElementById('eventSelect').value;
      currentEventId = selectedId;
      fetchEventDetail(selectedId);
    }

    async function fetchEventDetail(eventId) {
      try {
        const res = await fetch(`${GAS_API_URL}?action=getDetail&eventId=${encodeURIComponent(eventId)}`);
        const json = await res.json();
        if (json.success && json.data) {
          renderDetail(json.data);
        }
      } catch (err) {
        console.error('詳細取得エラー:', err);
      }
    }

    function renderDetail(data) {
      if (!data || !data.event) return;

      document.getElementById('eventTitle').textContent = data.event.title;
      document.getElementById('eventDateTime').textContent = `${data.event.date} ${data.event.time}`;
      document.getElementById('eventDesc').textContent = data.event.description || '特記事項なし';

      const attendees = data.attendees || [];
      const attendList = attendees.filter(a => a.status === '参加');
      const absentList = attendees.filter(a => a.status === '不参加');

      document.getElementById('attendCountChip').textContent = `${attendList.length}名`;
      document.getElementById('absentCountChip').textContent = `${absentList.length}名`;

      // 自身の選択ボタンスタイル反映
      const myRecord = attendees.find(a => a.uid === currentUser.uid);
      const btnAttend = document.getElementById('btnAttend');
      const btnAbsent = document.getElementById('btnAbsent');

      btnAttend.classList.remove('is-active');
      btnAbsent.classList.remove('is-active');

      if (myRecord) {
        if (myRecord.status === '参加') btnAttend.classList.add('is-active');
        if (myRecord.status === '不参加') btnAbsent.classList.add('is-active');
      }

      // 【改修】参加者リスト描画
      const attendEl = document.getElementById('attendList');
      attendEl.innerHTML = '';
      if (attendList.length === 0) {
        attendEl.innerHTML = '<li class="empty-text">まだ参加予定の人はいません</li>';
      } else {
        attendList.forEach(a => attendEl.appendChild(createAttendeeItem(a)));
      }

      // 【改修】不参加者リスト描画
      const absentEl = document.getElementById('absentList');
      absentEl.innerHTML = '';
      if (absentList.length === 0) {
        absentEl.innerHTML = '<li class="empty-text">不参加の回答はありません</li>';
      } else {
        absentList.forEach(a => absentEl.appendChild(createAttendeeItem(a)));
      }
    }

    function createAttendeeItem(person) {
      const li = document.createElement('li');
      li.className = 'attendee-item';

      const avatarWrapper = document.createElement('div');
      avatarWrapper.className = 'avatar-wrapper';

      if (person.iconUrl) {
        const img = document.createElement('img');
        img.className = 'avatar-img';
        img.src = person.iconUrl;
        avatarWrapper.appendChild(img);
      } else {
        avatarWrapper.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px;">person</span>';
      }

      const name = document.createElement('div');
      name.className = 'attendee-name';
      name.textContent = person.name + (person.uid === currentUser.uid ? ' (あなた)' : '');

      li.appendChild(avatarWrapper);
      li.appendChild(name);
      return li;
    }

    async function submitStatus(status) {
      const eventId = document.getElementById('eventSelect').value;
      if (!eventId) return;

      if (status === '参加') {
        document.getElementById('attendCountChip').textContent = '記録中...';
      } else {
        document.getElementById('absentCountChip').textContent = '記録中...';
      }

      try {
        const payload = {
          action: 'record',
          eventId: eventId,
          uid: currentUser.uid,
          name: currentUser.name,
          status: status,
          iconUrl: currentUser.iconUrl
        };

        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });

        const json = await res.json();
        if (json.success && json.data) {
          renderDetail(json.data);
        } else {
          alert('登録エラー: ' + (json.error || '不明なエラー'));
        }
      } catch (err) {
        alert('通信エラーが発生しました: ' + err.message);
      }
    }
  </script>
</body>
</html>
